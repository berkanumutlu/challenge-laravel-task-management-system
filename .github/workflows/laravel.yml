name: Laravel Task Management System (Challenge)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.1'
      - uses: actions/checkout@v4

      - name: Copy .env if not exists
        run: php -r "file_exists('project/.env') || copy('project/.env.example', 'project/.env');"

      - name: Clear Composer Cache
        run: composer clear-cache
      - name: Install Dependencies with composer
        working-directory: project
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Dependencies with npm
        working-directory: project
        run: npm install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Build assets with npm (Vite)
        working-directory: project
        run: npm run build

      - name: Generate project APP_KEY
        working-directory: project
        run: php artisan key:generate

      - name: Set Directory Permissions
        working-directory: project
        run: chmod -R 777 storage bootstrap/cache

      - name: Start MySQL service
        run: |
          docker run --name mysql-container -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=laravel_testing -p 3306:3306 -d mysql:8.0
          sleep 15
      - name: Setup Database
        run: |
          mysql -u root -proot -h 127.0.0.1 -e "CREATE DATABASE IF NOT EXISTS laravel_testing;"

      - name: Generate APP_KEY for Testing environment
        working-directory: project
        run: php artisan key:generate --env=testing
      - name: Run Migrations for Testing environment
        working-directory: project
        run: |
          sleep 10
          php artisan session:table
          php artisan migrate --env=testing --force

      - name: Start Laravel Test Server
        working-directory: project
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
        working-directory: project
        run: php artisan test --env=testing
